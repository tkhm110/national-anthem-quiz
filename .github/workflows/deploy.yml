name: Deploy

# main にマージされたら Cloudflare Workers（静的アセット）に公開する。
# 手動でやり直したいときは Actions の画面から実行できる（production 環境は main からしか使えない設定にする）
on:
  push:
    branches: [main]
  workflow_dispatch:

# 必要最小限の権限（リポジトリの読み取りだけ）
permissions:
  contents: read

# 公開は1つずつ順番に行う（途中で取り消すと中途半端な状態になり得るので、取り消さない）
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # シークレットは production 環境にだけ置き、PR のワークフローからは読めないようにする
    environment: production
    steps:
      # アクションは改ざん対策としてタグではなくコミット SHA で固定する（コメントは対応するバージョン）
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # main の内容は PR の CI で検証済みだが、公開する前にもう一度確かめる
      - run: pnpm validate:data
      - run: pnpm test
      - run: pnpm build

      # wrangler は package.json で版を固定している（pnpm-lock.yaml と Dependabot で管理する）
      - name: Deploy to Cloudflare
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
