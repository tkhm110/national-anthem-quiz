name: CI

on:
  pull_request:
  push:
    branches: [main]

# 必要最小限の権限（リポジトリの読み取りだけ）
permissions:
  contents: read

# 同じブランチに続けて push したら、古い実行は取り消す
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # アクションは改ざん対策としてタグではなくコミット SHA で固定する（コメントは対応するバージョン）
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # pnpm のバージョンは package.json の packageManager から読み取られる
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Node のバージョンは .node-version で一元管理する（手元の環境と合わせる）
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm validate:data
      - run: pnpm test
      - run: pnpm build
