version: 2
updates:
  # npm パッケージ（pnpm-lock.yaml も更新される）
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Tokyo
    # 公開直後の版は避ける（乗っ取られたパッケージが公開されてもすぐ取り込まないため）
    cooldown:
      default-days: 7
    # minor・patch の更新は1つの PR にまとめて、PR の数を抑える。
    # メジャー更新はまとめず、パッケージごとに別の PR になる（原因を切り分けやすくするため）
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Node の型定義は、実際に使う Node のメジャー版（.node-version）に合わせる。
      # Node を上げるときに、手で一緒に上げる
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 5

  # GitHub Actions（ci.yml に固定した SHA とバージョンのコメントが更新される）
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Tokyo
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
